<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">The CodeShip workflow</title><desc id="desc">Create, build, preview, save and export locally.</desc><rect width="1000" height="290" rx="18" fill="#19261f"/><g font-family="Segoe UI, sans-serif"><text x="32" y="44" fill="#b7ed98" font-size="12" letter-spacing="3">FROM YOUR CANVAS TO YOUR CODE</text><g fill="#26382d" stroke="#526647"><rect x="32" y="85" width="168" height="120" rx="12"/><rect x="224" y="85" width="168" height="120" rx="12"/><rect x="416" y="85" width="168" height="120" rx="12"/><rect x="608" y="85" width="168" height="120" rx="12"/><rect x="800" y="85" width="168" height="120" rx="12"/></g><g fill="#b7ed98" font-size="13"><text x="50" y="115">01</text><text x="242" y="115">02</text><text x="434" y="115">03</text><text x="626" y="115">04</text><text x="818" y="115">05</text></g><g fill="#f2f7ef" font-size="22"><text x="50" y="152">Create</text><text x="242" y="152">Build</text><text x="434" y="152">Preview</text><text x="626" y="152">Save</text><text x="818" y="152">Export</text></g><g fill="#b5c6b8" font-size="13"><text x="50" y="180">Your own project</text><text x="242" y="180">Layout + style</text><text x="434" y="180">Real device widths</text><text x="626" y="180">Permanent folders</text><text x="818" y="180">Independent source</text><text x="32" y="253">No account. No cloud dependency. Your work stays with you.</text></g></g><path d="m205 145h12m-5-5 5 5-5 5m185-5h12m-5-5 5 5-5 5m185-5h12m-5-5 5 5-5 5m185-5h12m-5-5 5 5-5 5" fill="none" stroke="#b7ed98" stroke-width="2"/></svg>
