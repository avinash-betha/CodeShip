name: CodeShip verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm test:exports
      - run: node node_modules/electron/install.js
      - run: pnpm desktop:build
      - run: pnpm test:desktop
      - run: pnpm desktop:unpacked
      - run: pnpm test:desktop
        env:
          CODESHIP_PACKAGED_EXE: release/win-unpacked/CodeShip.exe
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results
          path: test-results/
