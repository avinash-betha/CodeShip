name: CodeShip desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        if: runner.os == 'Windows'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build renderer and Electron host
        run: pnpm desktop:build
      - name: Check customer documentation boundary
        run: pnpm docs:verify-production
      - name: Package Windows installer and portable application
        if: runner.os == 'Windows'
        run: >-
          pnpm exec electron-builder --config electron-builder.yml
          --win nsis portable --x64 --publish never
          '--config.portable.artifactName=CodeShip-${version}-${arch}-portable.${ext}'
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: >-
          pnpm exec electron-builder --config electron-builder.macos.yml
          --mac --${{ matrix.arch }} --publish never
      - name: Check Windows package and native lifecycle
        if: runner.os == 'Windows'
        run: |
          pnpm docs:verify-production --packaged
          pnpm test:installer
          pnpm test:portable
      - name: Upload application downloads
        uses: actions/upload-artifact@v7
        with:
          name: CodeShip-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
